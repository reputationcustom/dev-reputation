name: Deploy Supabase (DB + Functions)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ktvyqpogfnowuqmjybvu

    steps:
      - uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Vincula ao projeto remoto — precisa da senha do banco (Dashboard > Settings > Database)
      # cadastrada como secret SUPABASE_DB_PASSWORD no repo (Settings > Secrets and variables > Actions).
      - name: Link project
        run: supabase link --project-ref $PROJECT_ID --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      # Aplica as migrations pendentes de supabase/migrations/ — é o que estava faltando
      # rodar manualmente (ex: buckets do Storage, tabelas novas) a cada deploy.
      - name: Push database migrations
        run: supabase db push

      # Deploy de todas as Edge Functions (verify_jwt já vem de supabase/config.toml por função —
      # não precisa mais do flag --no-verify-jwt aqui, ele duplicava/sobrescrevia essa config).
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref $PROJECT_ID --debug
